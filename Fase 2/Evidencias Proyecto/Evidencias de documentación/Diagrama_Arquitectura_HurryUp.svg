<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="870" viewBox="0 0 2240 870"><rect width="2240" height="870" fill="#fff"/><text x="40" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1F3864" font-weight="700"  >HurryUp · Arquitectura del sistema</text><text x="40" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#595959"   font-style="italic">Aplicación web en tres capas con servicios externos. Las flechas indican el sentido de la comunicación.</text><rect x="40" y="100" width="300" height="560" rx="14" fill="#F2F6FC" stroke="#B4C3E0" stroke-width="1.6"/><text x="56" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1F3864" font-weight="700"  >Usuarios</text><rect x="60" y="145" width="260" height="90" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="190" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >Cliente final</text><text x="190" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Reserva horas en el</text><text x="190" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Marketplace y por WhatsApp</text><rect x="60" y="265" width="260" height="90" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="190" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >Negocio</text><text x="190" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Dueño, administrador y</text><text x="190" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >profesionales (dashboard)</text><rect x="60" y="385" width="260" height="90" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="190" y="413" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >Super Admin</text><text x="190" y="437" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Aprueba postulaciones y</text><text x="190" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >activa complementos</text><rect x="60" y="505" width="260" height="90" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="190" y="533" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >Persona postulante</text><text x="190" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Se registra y postula</text><text x="190" y="577" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >con plan y motivo</text><rect x="400" y="100" width="380" height="560" rx="14" fill="#E8F0FB" stroke="#B4C3E0" stroke-width="1.6"/><text x="416" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1F3864" font-weight="700"  >Front</text><rect x="425" y="145" width="330" height="130" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="590" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >Next.js 15 · React · TypeScript</text><text x="590" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Marketplace y reserva pública</text><text x="590" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Dashboard del negocio</text><text x="590" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Postulación /apply y estado</text><text x="590" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Panel Super Admin /admin</text><rect x="425" y="305" width="330" height="90" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="590" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >Tailwind CSS · componentes</text><text x="590" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Interfaz adaptable a escritorio y móvil</text><rect x="425" y="425" width="330" height="90" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="590" y="453" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >Proxy de API (/api/v1)</text><text x="590" y="477" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Reenvía las llamadas al back y</text><text x="590" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >conserva las cookies de sesión</text><text x="425" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#595959"   >Autenticación: cookies HttpOnly</text><text x="425" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#595959"   >(token de acceso y de renovación).</text><rect x="850" y="100" width="700" height="560" rx="14" fill="#E8F0FB" stroke="#B4C3E0" stroke-width="1.6"/><text x="866" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1F3864" font-weight="700"  >Back · API Spring Boot (Java 21)</text><rect x="875" y="145" width="650" height="80" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="1200" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >api</text><text x="1200" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Controladores REST · DTOs · mapeadores · manejo de errores</text><rect x="875" y="245" width="650" height="80" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="1200" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >application</text><text x="1200" y="297" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Servicios (reservas, postulaciones, complementos, WhatsApp) · validadores</text><rect x="875" y="345" width="650" height="80" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="1200" y="373" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >domain</text><text x="1200" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Modelo y eventos de dominio</text><rect x="875" y="445" width="650" height="175" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="1200" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >infrastructure</text><text x="1200" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Persistencia JPA · seguridad (JWT, TOTP, roles)</text><text x="1200" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Correo (plantillas Thymeleaf) · almacenamiento de archivos</text><text x="1200" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Planes locales (sin cobro) · mensajería · configuración</text><rect x="1620" y="100" width="580" height="330" rx="14" fill="#F2F6FC" stroke="#B4C3E0" stroke-width="1.6"/><text x="1636" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1F3864" font-weight="700"  >Datos</text><rect x="1645" y="150" width="530" height="230" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2"/><text x="1910" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1F3864" font-weight="700" text-anchor="middle" >PostgreSQL</text><text x="1910" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Más de 70 tablas · migraciones Flyway</text><text x="1910" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Datos de negocios, agenda, usuarios y mensajes</text><text x="1910" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Planes y suscripciones locales (sin cobro)</text><rect x="1620" y="460" width="580" height="230" rx="14" fill="#FFF4E5" stroke="#B4C3E0" stroke-width="1.6"/><text x="1636" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1F3864" font-weight="700"  >Servicios externos</text><rect x="1645" y="500" width="255" height="120" rx="10" fill="#fff" stroke="#C55A11" stroke-width="2"/><text x="1772.5" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#C55A11" font-weight="700" text-anchor="middle" >WhatsApp Cloud API</text><text x="1772.5" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Meta · webhook con firma</text><text x="1772.5" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >verificada</text><rect x="1920" y="500" width="255" height="120" rx="10" fill="#fff" stroke="#C55A11" stroke-width="2"/><text x="2047.5" y="528" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#C55A11" font-weight="700" text-anchor="middle" >Correo SMTP</text><text x="2047.5" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >Avisos de postulación,</text><text x="2047.5" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333"  text-anchor="middle" >reservas y complementos</text><line x1="320" y1="190" x2="425" y2="210" stroke="#6B7A99" stroke-width="2" /><polygon points="425,210 413.2680965201978,212.52238790446754 415.01685380532734,203.34141215753723" fill="#6B7A99"/><polygon points="320,190 331.7319034798022,187.47761209553246 329.98314619467266,196.65858784246277" fill="#6B7A99"/><line x1="320" y1="310" x2="425" y2="260" stroke="#6B7A99" stroke-width="2" /><polygon points="425,260 417.0300129831834,268.97102596985286 413.0118364508823,260.5328552520206" fill="#6B7A99"/><polygon points="320,310 327.9699870168166,301.02897403014714 331.9881635491177,309.4671447479794" fill="#6B7A99"/><line x1="320" y1="430" x2="425" y2="290" stroke="#6B7A99" stroke-width="2" /><polygon points="425,290 422.1067769293423,301.64599760705 414.6299447570162,296.0383734778054" fill="#6B7A99"/><polygon points="320,430 322.8932230706577,418.35400239295 330.3700552429838,423.9616265221946" fill="#6B7A99"/><line x1="320" y1="550" x2="425" y2="330" stroke="#6B7A99" stroke-width="2" /><polygon points="425,330 424.45657338647754,341.98768899812285 416.0219493137085,337.96207296339213" fill="#6B7A99"/><polygon points="320,550 320.54342661352246,538.0123110018772 328.9780506862915,542.0379270366078" fill="#6B7A99"/><line x1="755" y1="470" x2="875" y2="185" stroke="#6B7A99" stroke-width="2" /><polygon points="875,185 875.0177306455514,196.99998690100153 866.4040893655688,193.3731905725878" fill="#6B7A99"/><polygon points="755,470 754.9822693544486,458.00001309899847 763.5959106344312,461.62680942741224" fill="#6B7A99"/><text x="815" y="319.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#595959"  text-anchor="middle" >HTTPS · JSON</text><line x1="1525" y1="470" x2="1645" y2="200" stroke="#6B7A99" stroke-width="2" /><polygon points="1645,200 1644.7813201504025,211.9980072980216 1636.2408006676937,208.20222086126213" fill="#6B7A99"/><polygon points="1525,470 1525.2186798495975,458.0019927019784 1533.7591993323063,461.79777913873784" fill="#6B7A99"/><text x="1585" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#595959"  text-anchor="middle" >JDBC</text><line x1="1525" y1="548" x2="1645" y2="548" stroke="#6B7A99" stroke-width="2" /><polygon points="1645,548 1633.9472680719655,552.6730201077038 1633.9472680719655,543.3269798922962" fill="#6B7A99"/><polygon points="1525,548 1536.0527319280345,543.3269798922962 1536.0527319280345,552.6730201077038" fill="#6B7A99"/><text x="1585" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#595959"  text-anchor="middle" >webhook</text><polyline points="1525,592 1580,650 2047,650" fill="none" stroke="#6B7A99" stroke-width="2"/><line x1="2047" y1="650" x2="2047" y2="622" stroke="#6B7A99" stroke-width="2" /><polygon points="2047,620 2041,634 2053,634" fill="#6B7A99"/><text x="1800" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#595959"  text-anchor="middle" >SMTP · envío de correos</text><text x="40" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#222"   >Flujo de la postulación: el postulante envía el formulario → el back guarda la postulación (applications) y avisa por correo al Super Admin → el Super Admin la acepta o rechaza desde el panel →</text><text x="40" y="765" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#222"   >el postulante recibe el correo y continúa con el onboarding para crear su negocio. Los complementos siguen el mismo camino con module_requests.</text><text x="40" y="810" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#595959"   >En desarrollo, el webhook de WhatsApp llega al sistema mediante un túnel (ngrok) hacia el front, que reenvía a la API.</text></svg>