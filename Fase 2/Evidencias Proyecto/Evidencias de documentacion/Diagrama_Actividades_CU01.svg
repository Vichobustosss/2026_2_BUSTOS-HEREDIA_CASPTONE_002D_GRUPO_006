<text x="180" y="92" font-size="12" fill="#333">Inicio</text>
<rect x="35" y="125" width="250" height="70" rx="10" fill="#fff1c2" stroke="#b07d00" stroke-width="2" />
<text x="44" y="140" font-size="11.5" font-weight="800" fill="#b07d00">A01</text>
<text x="160" y="161.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Elige su plan, crea su cuenta</text>
<text x="160" y="176.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">y dice por qué quiere postular</text>
<rect x="355" y="227" width="250" height="70" rx="10" fill="#fff1c2" stroke="#b07d00" stroke-width="2" />
<text x="364" y="242" font-size="11.5" font-weight="800" fill="#b07d00">A02</text>
<text x="480" y="263.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Valida correo, contraseña,</text>
<text x="480" y="278.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">plan y motivo</text>
<polygon points="480,327 595,372 480,417 365,372" fill="#fff1c2" stroke="#b07d00" stroke-width="2" />
<text x="480" y="376" text-anchor="middle" font-size="12.5" font-weight="600" fill="#222">¿Datos válidos?</text>
<text x="492" y="321" font-size="11" font-weight="800" fill="#b07d00">D1</text>
<rect x="35" y="337" width="250" height="70" rx="10" fill="#fff1c2" stroke="#b07d00" stroke-width="2" />
<text x="44" y="352" font-size="11.5" font-weight="800" fill="#b07d00">A03</text>
<text x="160" y="373.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Corrige los datos</text>
<text x="160" y="388.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">señalados</text>
<rect x="355" y="447" width="250" height="70" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="364" y="462" font-size="11.5" font-weight="800" fill="#666666">A04</text>
<text x="480" y="483.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Crea la cuenta pendiente y registra</text>
<text x="480" y="498.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">la postulación (plan y motivo)</text>
<rect x="160" y="562" width="640" height="8" fill="#222"/>
<rect x="35" y="593" width="250" height="70" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="44" y="608" font-size="11.5" font-weight="800" fill="#666666">A06</text>
<text x="160" y="629.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Ve «postulación enviada» y</text>
<text x="160" y="644.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">recibe un acuse por correo</text>
<rect x="675" y="593" width="250" height="70" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="684" y="608" font-size="11.5" font-weight="800" fill="#666666">A05</text>
<text x="800" y="629.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Recibe el aviso de la nueva</text>
<text x="800" y="644.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">postulación por correo</text>
<rect x="160" y="718" width="640" height="8" fill="#222"/>
<rect x="675" y="765" width="250" height="70" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="684" y="780" font-size="11.5" font-weight="800" fill="#666666">A07</text>
<text x="800" y="801.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Revisa la postulación en el panel</text>
<text x="800" y="816.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">(correo, plan y motivo)</text>
<polygon points="800,870 925,918 800,966 675,918" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="800" y="914.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#222">¿Acepta la</text>
<text x="800" y="929.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#222">postulación?</text>
<text x="812" y="864" font-size="11" font-weight="800" fill="#666666">D2</text>
<rect x="675" y="1011" width="250" height="70" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="684" y="1026" font-size="11.5" font-weight="800" fill="#666666">A08</text>
<text x="800" y="1047.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Rechaza con motivo y el sistema</text>
<text x="800" y="1062.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">avisa al postulante por correo</text>
<circle cx="800" cy="1128" r="15" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="800" cy="1128" r="9" fill="#222"/>
<text x="824" y="1132" font-size="12" fill="#333">Fin: rechazada</text>
<rect x="355" y="1011" width="250" height="70" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="364" y="1026" font-size="11.5" font-weight="800" fill="#666666">A09</text>
<text x="480" y="1047.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Activa la cuenta y envía el correo</text>
<text x="480" y="1062.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">«ya puedes iniciar tu onboarding»</text>
<rect x="35" y="1117" width="250" height="70" rx="10" fill="#fff1c2" stroke="#b07d00" stroke-width="2" />
<text x="44" y="1132" font-size="11.5" font-weight="800" fill="#b07d00">A10</text>
<text x="160" y="1153.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Inicia el onboarding normal: negocio,</text>
<text x="160" y="1168.5" text-anchor="middle" font-size="12.5" fill="#1a1a1a">URL y sucursal, hasta el dashboard</text>
<rect x="35" y="1232" width="250" height="86" rx="10" fill="#fff1c2" stroke="#b07d00" stroke-width="2" />
<text x="44" y="1247" font-size="11.5" font-weight="800" fill="#b07d00">A11</text>
<text x="160" y="1269" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Configura servicios y portafolio;</text>
<text x="160" y="1284" text-anchor="middle" font-size="12.5" fill="#1a1a1a">el negocio queda en el Marketplace</text>
<text x="160" y="1299" text-anchor="middle" font-size="12.5" fill="#1a1a1a">y recibe reservas</text>
<circle cx="160" cy="1395" r="15" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="160" cy="1395" r="9" fill="#222"/>
<text x="184" y="1399" font-size="12" fill="#333">Fin: negocio operativo</text>
