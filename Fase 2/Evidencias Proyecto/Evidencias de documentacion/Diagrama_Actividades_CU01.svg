<text x="12" y="1452" font-size="13" font-weight="700" fill="#222">Leyenda de estado</text>
<rect x="170" y="1439" width="30" height="18" rx="4" fill="#d9f2df" stroke="#2e7d32" stroke-width="2" /><text x="208" y="1453" font-size="12.5" fill="#222">Implementada</text>
<rect x="340" y="1439" width="30" height="18" rx="4" fill="#fff1c2" stroke="#b07d00" stroke-width="2" /><text x="378" y="1453" font-size="12.5" fill="#222">Parcial</text>
<rect x="510" y="1439" width="30" height="18" rx="4" fill="#eeeeee" stroke="#666666" stroke-width="2" stroke-dasharray="6 4"/><text x="548" y="1453" font-size="12.5" fill="#222">Pendiente</text>
<text x="12" y="1478" font-size="11.5" fill="#444">CU-01 · Postular y activar un negocio (A01–A11) · Caso simulado: peluquería canina «Patitas Limpias» · HurryUp</text>
